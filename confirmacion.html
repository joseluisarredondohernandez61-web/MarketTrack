<div class="container my-5" style="max-width: 600px;">
    <div class="border p-4 rounded bg-white">
        <h2 class="text-center mb-4">Confirmar Pedido</h2>  
        <form>
            <div class="mb-3">
                <label class="form-label">Nombre del cliente:</label>
                <input type="text" class="form-control" placeholder="Escribe tu nombre">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Dirección de entrega:</label>
                <textarea class="form-control" rows="2" placeholder="Calle y número"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Método de pago:</label>
                <select class="form-control">
                    <option>Efectivo</option>
                    <option>Tarjeta</option>
                    <option>Otros(Vales,ofertas de la tienda, etc.)</option>
                </select>
            </div>
            <div class="border p-3 rounded bg-light mb-3">
                <p class="mb-1">Total a pagar:</p>
                <h4 class="text-primary mb-0">$11.60 MXN</h4>
            </div>
            <button type="submit" class="btn btn-dark w-100">Confirmar Pedido</button>
        </form>
    </div>
</div>
